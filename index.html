<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>角色狀態欄工坊 · HUD Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pg:#f3efe9;--pn:#fffdfa;--ink:#2b2a33;--mut:#7a7684;--line:#e4ddd2;--acc:#6b5bd6;--acc2:#e08fb0;--sh:0 10px 40px rgba(60,40,90,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#121118;--pn:#1b1a24;--ink:#ece9f5;--mut:#9b97ab;--line:#2d2b3a;--acc:#a898ff;--acc2:#f2a1c4;--sh:0 10px 40px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--pg:#121118;--pn:#1b1a24;--ink:#ece9f5;--mut:#9b97ab;--line:#2d2b3a;--acc:#a898ff;--acc2:#f2a1c4;--sh:0 10px 40px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--pg);color:var(--ink);font:15px/1.6 "Noto Sans TC",system-ui,sans-serif;
background-image:radial-gradient(60rem 30rem at 85% -10%,color-mix(in srgb,var(--acc) 18%,transparent),transparent),radial-gradient(40rem 24rem at -5% 10%,color-mix(in srgb,var(--acc2) 14%,transparent),transparent);background-attachment:fixed}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 40%,transparent)}
h1{font:700 24px "Noto Serif TC",serif;margin:0;letter-spacing:.04em}
header p{margin:0;color:var(--mut);font-size:13px}
.steps{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.steps button{flex:1;min-width:92px;display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);background:var(--pn);color:var(--mut);border-radius:14px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}
.steps b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--line);color:var(--ink)}
.steps .on{color:var(--ink);border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.steps .on b,.steps .done b{background:var(--acc);color:#fff}
.main{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:22px;align-items:start}
.panel{background:var(--pn);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--sh)}
.panel h2{font:700 20px "Noto Serif TC",serif;margin:0 0 4px}
.hint{color:var(--mut);margin:0 0 18px;font-size:13.5px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;font:inherit;cursor:pointer;text-align:left;transition:.2s}
.opt svg{color:var(--acc);margin-bottom:4px}.opt small{color:var(--mut);font-size:11.5px;line-height:1.35}
.opt:hover{transform:translateY(-2px);border-color:var(--acc)}.opt.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:12px}
input[type=text],input[type=number],textarea{width:100%;margin-top:4px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--pg);color:var(--ink);font:inherit}
input:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--acc) 50%,transparent);border-color:var(--acc)}
.lbl{font-size:12.5px;color:var(--mut);margin:6px 0}
select{width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--pg);color:var(--ink);font:inherit}
.libg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lib{text-align:left;border:1px solid var(--line);background:transparent;border-radius:14px;padding:11px 12px;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:2px;transition:.2s}.lib b{font-size:14px}.lib i{font-style:normal;font-size:11px;color:var(--acc)}.lib small{font-size:12px;color:var(--mut);line-height:1.4}.lib:hover{border-color:var(--acc);transform:translateY(-2px)}.lib.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 14%,transparent)}@media(max-width:560px){.libg{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--pg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin-bottom:16px}.seg button{border:0;background:none;color:var(--mut);padding:7px 18px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}.seg .on{background:var(--pn);color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.14)}
.tzg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tzb{border:1px solid var(--line);background:transparent;border-radius:14px;padding:6px 6px 9px;cursor:pointer;font:inherit;font-size:12px;color:var(--mut);transition:.2s}.tzb:hover{border-color:var(--acc);transform:translateY(-2px)}.tzb.on{border-color:var(--acc);color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 16%,transparent)}
.tzm.hud{margin:0 0 7px;padding:0;border:0;box-shadow:none;border-radius:10px;height:64px;max-width:none;display:grid;place-items:center;background:var(--bg);animation:none}
.adv{grid-column:1/-1;font-size:12px;color:var(--mut)}.adv summary{cursor:pointer}.ao{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}.ao select{width:auto;margin:0;padding:5px 9px}.ck{display:flex;gap:6px;align-items:center;margin:0;color:var(--ink)}
.dh{cursor:grab;color:var(--mut);font-size:16px;text-align:center;user-select:none}.dov{outline:2px dashed var(--acc);outline-offset:2px}.ao .btn{padding:3px 10px}
#pv .ac{pointer-events:auto;cursor:grab;touch-action:none}
.rp{position:absolute;width:12px;height:12px;margin:-6px;border:2px solid var(--acc);border-radius:50%;pointer-events:none;animation:rip .7s ease-out forwards}@keyframes rip{to{transform:scale(14);opacity:0}}
.icons{display:flex;gap:8px;flex-wrap:wrap}
.ic{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;background:transparent;color:var(--ink);cursor:pointer;font:inherit;font-size:11px;margin:0}
.ic.on{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.th{border:2px solid transparent;border-radius:14px;padding:12px 10px 10px;cursor:pointer;text-align:left;font:inherit;transition:.2s}
.th:hover{transform:translateY(-2px)}.th.on{border-color:var(--acc)}
.th i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:4px;vertical-align:middle}
.th b{display:block;margin-top:8px;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=color]{width:100%;height:38px;margin-top:4px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--pg);cursor:pointer}
.frow{display:grid;grid-template-columns:18px 34px 1fr 1.2fr 28px;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.frow input[type=text],.frow input[type=number]{margin:0;padding:6px 9px}
.frow .ct{display:flex;align-items:center;gap:8px;min-width:0}.frow .ct input[type=range]{flex:1;min-width:0}.frow em{font-style:normal;font-size:11.5px;color:var(--mut);min-width:44px;text-align:right}
.tag{font-size:11px;text-align:center;padding:3px 0;border-radius:8px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);font-weight:700}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:18px}.x:hover{color:#e5484d}
input[type=range]{accent-color:var(--acc)}
.adds{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.btn{padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 35%,transparent)}
.btn.pri:hover{color:#fff;filter:brightness(1.06)}
.nav{display:flex;justify-content:space-between;margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips .btn.on{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;margin:12px 0;color:var(--ink)}
textarea{height:300px;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.pvbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.stage{position:relative;border-radius:22px;padding:76px 14px 34px;border:1px solid var(--line);background-color:var(--pn);background-image:radial-gradient(color-mix(in srgb,var(--mut) 30%,transparent) 1px,transparent 1px);background-size:16px 16px;box-shadow:var(--sh);cursor:pointer;overflow:hidden}
.stage>span{position:absolute;top:10px;left:16px;font-size:11px;letter-spacing:.12em;color:var(--mut)}
.sbtn{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.sbtn .btn{padding:6px 14px;font-size:12.5px}.sbtn .btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.fx{position:absolute;pointer-events:none;font-size:18px;animation:pop .9s cubic-bezier(.1,.8,.3,1) forwards;z-index:9}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,40px);background:var(--ink);color:var(--pg);padding:9px 18px;border-radius:99px;font-size:13px;opacity:0;transition:.3s;z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:960px){.main{grid-template-columns:1fr}.pvbox{position:static;order:-1}.grid3,.themes{grid-template-columns:repeat(2,1fr)}.frow{grid-template-columns:18px 30px 1fr 24px}.frow .ct{grid-column:1/-1}}
</style>
</head>

</div>
</div>

const SCN_CSS=".hud.sn-on{isolation:isolate}.hud s.sn{display:block;z-index:-1;opacity:var(--so,.6)}.hud s.sn svg{position:absolute;left:0;bottom:0;width:100%;height:60%}.hud s.sn.sp-bottom svg{-webkit-mask:linear-gradient(transparent,#000 22%);mask:linear-gradient(transparent,#000 22%)}.hud s.sn.sp-top svg{top:0;bottom:auto;-webkit-mask:linear-gradient(#000 78%,transparent);mask:linear-gradient(#000 78%,transparent)}.hud s.sn.sp-full svg{height:100%}.sn1{fill:var(--ac)}.sn2{fill:var(--ac2)}.sn3{fill:var(--tx)}.sn4{fill:var(--bg2)}.sn5{fill:color-mix(in srgb,var(--ac) 50%,var(--ac2))}.sn6{fill:color-mix(in srgb,var(--ac) 40%,var(--bg2))}.sn7{fill:color-mix(in srgb,var(--ac2) 55%,#fff)}.sns{fill:none;stroke:var(--tx);stroke-linecap:round}.snb{fill:none;stroke:var(--ac2);stroke-linecap:round}.snc1{fill:none;stroke:var(--ac);stroke-linecap:round}.snc2{fill:none;stroke:var(--ac2);stroke-linecap:round}.snc3{fill:none;stroke:color-mix(in srgb,var(--ac) 50%,var(--ac2));stroke-linecap:round}.hud s.bgi{display:block;z-index:-1;bottom:auto;height:320px;max-height:100%;opacity:var(--bo,.6);-webkit-mask:linear-gradient(#000 70%,transparent);mask:linear-gradient(#000 70%,transparent)}.hud s.bgi img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}.hud s.bgi.tx-ht:after{content:\"\";position:absolute;inset:0;background:radial-gradient(circle,rgba(0,0,0,.45) 1px,transparent 1.6px) 0 0/4px 4px}.hud s.bgi.tx-pp:after{content:\"\";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.1) 1px,transparent 1px) 0 0/3px 3px,radial-gradient(rgba(0,0,0,.12) 1px,transparent 1px) 1px 2px/5px 5px,rgba(255,240,220,.06)}.hud s.bgi:before{content:\"\";position:absolute;inset:0;z-index:1;background:var(--bg2);opacity:var(--bs,.3)}.hud s.bgi:after{z-index:2}";

const ST=(i,k,v)=>{S.states[i][k]=v;pv()};
function addState(){S.states.push({n:'新狀態',lb:'✨ 新狀態',ef:'glow',c:'#8e7dff',fid:'',op:'>=',v:50,lv:Math.max(0,...S.states.map((_,i)=>lvOf(i)))+1});panel();pv()}
function stateRow(s,i){const fo='<option value="">手動切換（無條件）</option>'+S.f.filter(f=>f.v!==undefined).map(f=>`<option value="${f.id}" ${s.fid==f.id?'selected':''}>${esc(f.n)}${f.t==='bar'?'（%）':''}</option>`).join('');
 return`<div class="frow" style="display:block"><div class="two"><label>按鈕名稱<input type="text" value="${esc(s.n)}" oninput="ST(${i},'n',this.value)"></label><label>徽章文字<input type="text" value="${esc(s.lb)}" oninput="ST(${i},'lb',this.value)"></label></div>${i?`<label style="margin-bottom:10px">層級（越大越優先，例如 1＝注意、2＝警告、3＝危急）<input type="number" min="1" max="99" value="${lvOf(i)}" oninput="S.states[${i}].lv=+this.value;pv()" onchange="panel()"></label>`:''}${i?`<div style="display:grid;grid-template-columns:1.6fr .7fr .8fr;gap:8px;margin-bottom:10px"><select onchange="ST(${i},'fid',this.value)">${fo}</select><select onchange="ST(${i},'op',this.value)">${['<=','>=','<','>','=='].map(o=>`<option ${s.op===o?'selected':''}>${o}</option>`).join('')}</select><input type="number" value="${s.v}" oninput="ST(${i},'v',+this.value)"></div>`:''}<div class="two"><label>效果<select onchange="ST(${i},'ef',this.value)">${EFS.map(([k,l])=>`<option value="${k}" ${s.ef===k?'selected':''}>${l}</option>`).join('')}</select></label><label>代表色<input type="color" value="${s.c||th().ac}" oninput="ST(${i},'c',this.value)"></label></div>${i?`<button class="btn" onclick="S.states.splice(${i},1);S.cur=-1;panel();pv()">刪除此狀態</button>`:''}</div>`}
function exportText(){
 if(S.ex==='html')return`<!-- 角色狀態欄：${S.name} -->\n<style>\n${CARD_CSS}\n</style>\n${cardHTML()}`;
 if(S.ex==='json')return JSON.stringify({...S,px:{...S.px,src:''},av:S.av.t==='img'?{t:'img',src:'(已省略)'}:S.av,step:undefined},null,2);
 const ln=S.f.map(f=>(f.t==='sec'?`\n【${f.n}】`:f.t==='bar'?`- ${f.n}：[數值]/${f.max}`:f.t==='heart'?`- ${f.n}：[0-${f.max}] 顆愛心`:f.t==='num'?`- ${f.n}：[數字]`:`- ${f.n}：[簡短描述]`)+NT(f)).join('\n');
 const rl0=S.states.map((s,i)=>i).filter(i=>i).sort((a,b)=>lvOf(b)-lvOf(a)||b-a).map(i=>{const s=S.states[i],f=S.f.find(x=>x.id==s.fid);return f?`- 〔層級 ${lvOf(i)}〕${f.n} ${s.op} ${s.v}${f.t==='bar'?'%':''} 時，當前狀態改為「${s.lb}」`:''}).filter(Boolean),rl=rl0.length?rl0.join('\n')+`\n（多條同時成立時，取層級數字最大的一條；都不成立時為「${S.states[0].lb}」）`:'';
 return`【狀態欄規則】\n每次回覆結尾，請依劇情更新 {{char}}（${S.name}，${S.title}）的狀態欄，並嚴格維持以下格式：\n\n━━━━━━━━━━━━━━\n${S.name}｜${S.title}\n當前狀態：[${S.states.map(s=>s.lb).join(' / ')}]${ln}\n━━━━━━━━━━━━━━\n\n規則：\n1. 數值依互動合理增減，單次變化不超過 15%。\n2. 狀態切換條件：\n${rl||'- 依劇情自行判斷'}\n3. 狀態欄只放在回覆最後，不要在劇情中重複。`}
$('#stage').addEventListener('click',e=>{const row=e.target.closest('.row[data-f]');if(S.bump&&row){const f=S.f.find(x=>x.id==row.dataset.f);if(f){f.v=f.v+f.max/10>f.max?0:Math.round(f.v+f.max/10);pv();if(ORD[S.step]===4)panel();return}}
 if(S.click==='cycle'){const o=stOrder(),k=o.indexOf(S.cur);S.cur=k<0?o[0]:o[(k+1)%o.length];pv()}
 if(S.click==='ripple'){const r=e.currentTarget.getBoundingClientRect(),p=document.createElement('span');p.className='rp';p.style.left=e.clientX-r.left+'px';p.style.top=e.clientY-r.top+'px';e.currentTarget.appendChild(p);setTimeout(()=>p.remove(),700)}});
$('#stage').addEventListener('mousemove',e=>{const h=$('#pv .hud');if(!h)return;const r=h.getBoundingClientRect();h.style.setProperty('--mx',e.clientX-r.left+'px');h.style.setProperty('--my',e.clientY-r.top+'px')});
const cssFor=h=>CARD_CSS.replace(/(?<=^|[}\n])\.(lt|sk|em)-([a-z0-9]+)\{[^}]*\}/g,(m,t,k)=>new RegExp(t+'-'+k+'(?![a-z0-9])').test(h)?m:'');
function exportText(){
 const card=cardTok(tokOn()&&S.ex==='html'),html=`<style>\n${exCSS(card)}\n</style>\n${card}`;
 if(S.ex==='html')return`<!-- 角色狀態欄：${S.name} -->\n`+html;
 if(S.ex==='json')return JSON.stringify({...S,px:{...S.px,src:''},av:S.av.t==='img'?{t:'img',src:'(已省略)'}:S.av,step:undefined},null,2);
 const ln=S.f.map(f=>(f.t==='sec'?`\n【${f.n}】`:f.t==='bar'?`- ${f.n}：[數值]/${f.max}`:f.t==='heart'?`- ${f.n}：[0-${f.max}] 顆愛心`:f.t==='num'?`- ${f.n}：[數字]`:`- ${f.n}：[簡短描述]`)+NT(f)).join('\n');
 const rl0=S.states.map((s,i)=>i).filter(i=>i).sort((a,b)=>lvOf(b)-lvOf(a)||b-a).map(i=>{const s=S.states[i],f=S.f.find(x=>x.id==s.fid);return f?`- 〔層級 ${lvOf(i)}〕${f.n} ${s.op} ${s.v}${f.t==='bar'?'%':''} 時，當前狀態改為「${s.lb}」`:''}).filter(Boolean),rl=rl0.length?rl0.join('\n')+`\n（多條同時成立時，取層級數字最大的一條；都不成立時為「${S.states[0].lb}」）`:'';
 if(S.ex==='full'){const bn=S.f.filter(f=>f.t==='bar').map(f=>`${f.n}（0–${f.max}）`).join('、');
  return `你是這段故事的敘事者。請在「每一則回覆的最後」附上一個狀態欄，規則如下：\n\n1. 使用下方 HTML 範本，<style> 與所有 class、id 名稱完全不要改，只更新文字與數值。\n2. 需要更新的欄位：${S.f.filter(f=>f.t!=='sec').map(f=>f.n).join('、')}${S.g.meta?'、日期／地點':''}。數值條（${bn||'無'}）要同步換算並更新 style 裡的 width 與 --w 百分比（目前值／上限），右上徽章文字依狀態改寫：\n${rl||'- 依劇情自行判斷'}${S.g.tb?'\n   分頁內容每頁不超過 60 字，用角色當下視角書寫，不要劇透。':''}${S.g.io?'\n   開場提示語與選項請依劇情改寫成 3–4 個可選行動，第 N 個選項會開啟第 N 個分頁。':''}\n   若對話中已有舊狀態欄，請把 id 前綴 hx 與對應選擇器一併改成新流水號（hx2、hx3…），避免互相干擾。\n3. 數值要跟劇情連動：事件發生才增減，每次變動幅度不超過 15%。\n4. 直接輸出 HTML，不要用程式碼區塊包起來，不要額外解釋。\n\n【HTML 範本】\n${html}`}
 return`【狀態欄規則】\n每次回覆結尾，請依劇情更新 {{char}}（${S.name}，${S.title}）的狀態欄，並嚴格維持以下格式：\n\n━━━━━━━━━━━━━━\n${S.name}｜${S.title}\n當前狀態：[${S.states.map(s=>s.lb).join(' / ')}]${ln}\n━━━━━━━━━━━━━━\n\n規則：\n1. 數值依互動合理增減，單次變化不超過 15%。\n2. 狀態切換條件：\n${rl||'- 依劇情自行判斷'}\n3. 狀態欄只放在回覆最後，不要在劇情中重複。`}
let dg=-1,ad=null;
const dnd=(a,i)=>`ondragover="event.preventDefault();this.classList.add('dov')" ondragleave="this.classList.remove('dov')" ondrop="this.classList.remove('dov');DR('${a}',${i})"`;
const dh=(a,i)=>`<span class="dh" draggable="true" ondragstart="dg=${i};event.dataTransfer.effectAllowed='move'" title="拖曳排序">⠿</span>`;
function DR(a,i){const L=a==='f'?S.f:a==='blk'?S.blk:a==='spin'?S.spin:S.acc;if(dg<0||dg===i)return;const[x]=L.splice(dg,1);L.splice(i,0,x);if(a==='acc')S.sel=i;dg=-1;panel();pv()}
function mvF(a,b){if(a===b||b<0||b>=S.f.length)return;const[x]=S.f.splice(a,1);S.f.splice(b,0,x);panel();pv()}
function mvA(d){const j=S.sel+d;if(j<0||j>=S.acc.length)return;[S.acc[S.sel],S.acc[j]]=[S.acc[j],S.acc[S.sel]];S.sel=j;panel();pv()}
document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest('#pv .ac');if(!el)return;const i=[...el.parentNode.querySelectorAll(':scope>.ac')].indexOf(el),a=S.acc[i];if(!a)return;ad={i,x:e.clientX,y:e.clientY,ox:a.x,oy:a.y,m:0};S.sel=i;e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!ad)return;const a=S.acc[ad.i];a.x=Math.round(ad.ox+e.clientX-ad.x);a.y=Math.round(ad.oy+e.clientY-ad.y);ad.m=1;pv()});
document.addEventListener('pointerup',()=>{if(!ad)return;if(ad.m)window.noClk=Date.now();ad=null;if(ORD[S.step]===6)panel()});
document.addEventListener('click',e=>{if(Date.now()-(window.noClk||0)<300&&e.target.closest&&e.target.closest('#pv')){e.preventDefault();e.stopPropagation()}},true);
function tiltReset(){const w=$('#pv .hw');if(w)w.style.transform=''}
$('#stage').addEventListener('mousemove',e=>{if(!S.tilt||S.g.fl)return;const w=$('#pv .hw');if(!w)return;const r=w.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;w.style.transform=`perspective(700px) rotateY(${x*14}deg) rotateX(${-y*14}deg)`});
$('#stage').addEventListener('mouseleave',tiltReset);
panel();pv();
</script>
